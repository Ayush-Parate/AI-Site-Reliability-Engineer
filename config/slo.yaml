# Detection thresholds. Consumed by the rule-based detector (Phase 4).
health_check_failures: 2        # consecutive failed /health checks open an incident
error_rate_threshold: 0.05      # 5% errors over the window
error_rate_window_seconds: 15
latency_p95_multiplier: 2.0     # p95 above 2x rolling baseline
latency_p95_slo_ms: 2000        # or above this absolute SLO limit
memory_growth_threshold_mb: 50  # RSS growth trend over the window
cpu_growth_threshold_pct: 30
recover_after_seconds: 10       # close incident once healthy for this long